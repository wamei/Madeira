# Builds an unsigned Debug IPA of Madeira on a GitHub-hosted macOS runner.
#
# The IPA is unsigned on purpose: sign it while sideloading (Sideloadly,
# AltStore, SideStore...) with your own Apple ID. A development signature
# keeps get-task-allow, which JIT through a debugger needs. Debug because
# docs/BUILDING.md: "Debug is the configuration that runs the games; Release
# builds have crashed the guest."
#
# Several steps follow the madeira-bcd fork's workflow
# (github.com/Aettarrass-sys/madeira-bcd, GPL-3.0), which worked out how to
# configure Wine's iOS tree, LLVM 15 for iOS and FEX on a hosted runner.
name: Build Madeira IPA (unsigned, Debug)

on:
  workflow_dispatch:
    inputs:
      merge_upstream:
        description: Merge willfaust/Madeira into this branch before building
        type: boolean
        default: true
      upstream_ref:
        description: Upstream branch, tag or commit to merge
        type: string
        default: main
      include_vcruntime:
        description: Put Microsoft's VC++ runtime DLLs in the IPA (downloaded from Microsoft)
        type: boolean
        default: false

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  MINGW_NAME: llvm-mingw-20260421-ucrt-macos-universal
  LLVM_TAG: llvmorg-15.0.7

jobs:
  # DXMT's Metal shaders, embedded as C headers: airconv's helpers (which
  # DXMT's meson build generates, dxmt/src/airconv/meson.build) and the
  # command library (as build/dxmt-ios/build.sh makes it, which then keeps
  # this newer copy). Xcode 27's Metal compiler rejects air_tessellation.metal
  # (__metal_atomic_fetch_add_explicit takes another argument), so Xcode 26.
  shaders:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Merge upstream
        if: inputs.merge_upstream
        shell: bash
        run: |
          git remote add upstream https://github.com/willfaust/Madeira.git
          git fetch --no-tags upstream "${{ inputs.upstream_ref }}"
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD

      - name: Compile shaders
        shell: bash
        run: |
          git submodule update --init --depth 1 dxmt
          xcodebuild -version
          xcrun -sdk macosx metal --version > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          OUT="$GITHUB_WORKSPACE/shader-headers"
          mkdir -p "$OUT" && cd "$OUT"
          for s in air_msad air_samplepos air_tessellation; do
            xcrun -sdk macosx metal -std=metal3.1 --target=air64-apple-macos14.0 \
              -o "$s.air" -c "$GITHUB_WORKSPACE/dxmt/src/airconv/shaders/$s.metal"
            xxd -n "$s" -i "$s.air" "$s.h"
          done
          xcrun -sdk macosx metal -std=metal3.1 --target=air64-apple-macos14.0 \
            -o dxmt_command.air -c "$GITHUB_WORKSPACE/dxmt/src/dxmt/dxmt_command.metal"
          xcrun -sdk macosx metallib -o dxmt_command.metallib dxmt_command.air
          xxd -n dxmt_command -i dxmt_command.metallib dxmt_command.h
          rm -f *.air *.metallib
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: shader-headers
          path: shader-headers
          retention-days: 1

  build:
    needs: shaders
    runs-on: xcode-27
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      # Full history so the upstream merge has a merge base; submodules are
      # fetched after the merge so their pins come from the merged tree.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Merge upstream
        if: inputs.merge_upstream
        shell: bash
        run: |
          git remote add upstream https://github.com/willfaust/Madeira.git
          git fetch --no-tags upstream "${{ inputs.upstream_ref }}"
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD
          echo "::notice::built from $(git rev-parse --short HEAD) (upstream $(git rev-parse --short FETCH_HEAD))"

      # FEX's test-binary repositories are large and only used by its tests.
      - name: Submodules
        shell: bash
        run: |
          git submodule sync
          git submodule update --init --depth 1 FEX wine dxmt madeira-dock
          git -C dxmt submodule update --init --recursive --depth 1
          SKIP="External/fex-posixtest-bins External/fex-gvisor-tests-bins External/fex-gcc-target-tests-bins External/Catch2"
          for p in $(git -C FEX config -f .gitmodules --get-regexp 'submodule\..*\.path' | awk '{print $2}'); do
            case " $SKIP " in *" $p "*) continue ;; esac
            git -C FEX submodule update --init --recursive --depth 1 "$p"
          done
          git submodule status

      - name: Revisions (cache keys)
        id: rev
        shell: bash
        run: |
          echo "wine=$(git -C wine rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "fex=$(git -C FEX rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "dxmt=$(git -C dxmt rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ffmpeg=$(shasum -a 256 build/ffmpeg/src/SHA256SUMS build/ffmpeg/build.sh | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "gnutls=$(shasum -a 256 build/gnutls-ios/src/SHA256SUMS build/gnutls-ios/build.sh | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Madeira is developed against the iOS 27 SDK (server_ios.c reads
      # rusage fields the iOS 26 SDK lacks). Newest released Xcode, no betas.
      - name: Select Xcode
        shell: bash
        run: |
          # Real folders only: the image's version symlinks (Xcode_27.2.app)
          # point at betas.
          NEWEST=$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' ! -iname '*beta*' | while read -r d; do
              echo "$(defaults read "$d/Contents/Info" CFBundleShortVersionString) $d"
            done | sort -V | tail -1 | cut -d' ' -f2-)
          sudo xcode-select -s "${NEWEST:-/Applications/Xcode.app}/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Tools
        shell: bash
        run: |
          brew install bison llvm lld ninja meson cabextract msitools
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-apple-ios
          if ! xcrun -sdk macosx metal --version > /dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      # ------------------------------------------------------------ llvm-mingw
      - name: Restore llvm-mingw
        id: mingw
        uses: actions/cache/restore@v4
        with:
          path: toolchains/${{ env.MINGW_NAME }}
          key: ${{ env.MINGW_NAME }}

      - name: Fetch llvm-mingw
        if: steps.mingw.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p toolchains
          curl -fL --retry 3 -o /tmp/mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/$MINGW_NAME.tar.xz"
          echo "bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7  /tmp/mingw.tar.xz" | shasum -a 256 -c
          tar -xJf /tmp/mingw.tar.xz -C toolchains/

      - name: Save llvm-mingw
        if: steps.mingw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: toolchains/${{ env.MINGW_NAME }}
          key: ${{ env.MINGW_NAME }}

      # The ARM64EC FEX module is otherwise the prebuilt DLL committed under
      # app/Madeira/arm64ec-windows; rebuild it from the pinned FEX so FEX-side
      # changes ship in this IPA.
      - name: Build FEX ARM64EC (xtajit64.dll)
        shell: bash
        run: |
          build/fex-arm64ec/build.sh > "$GITHUB_WORKSPACE/fex-arm64ec-build.log" 2>&1 || { tail -80 "$GITHUB_WORKSPACE/fex-arm64ec-build.log"; exit 1; }
          # Symbol map for resolving the raw addresses FEX diagnostics log
          # (build-logs artifact): image base from the headers, then symbols.
          T="$GITHUB_WORKSPACE/toolchains/$MINGW_NAME/bin"
          D=FEX/build-arm64ec/Bin/libarm64ecfex.dll
          { "$T/llvm-readobj" --file-headers "$D" | grep -i 'ImageBase'; "$T/llvm-nm" -n -C "$D"; } \
            > "$GITHUB_WORKSPACE/fex-arm64ec-syms.log" 2>&1 || true

      # ------------------------------------------------------------------ Wine
      # Host tools (widl, wrc, winebuild...) for the cross-configured tree.
      - name: Restore native Wine tools
        id: winenative
        uses: actions/cache/restore@v4
        with:
          path: wine/build-native
          key: wine-native-v1-${{ steps.rev.outputs.wine }}

      - name: Build native Wine tools
        if: steps.winenative.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p wine/build-native && cd wine/build-native
          ../configure --without-x --without-freetype --disable-tests > "$GITHUB_WORKSPACE/wine-native-configure.log" 2>&1 \
            || { tail -40 "$GITHUB_WORKSPACE/wine-native-configure.log"; exit 1; }
          N=$(sysctl -n hw.ncpu)
          # Only the host tools and the generated headers are used from this tree.
          make -j"$N" tools/widl/widl tools/wrc/wrc tools/wmc/wmc tools/winebuild/winebuild \
            tools/winegcc/winegcc tools/sfnt2fon/sfnt2fon tools/make_xftmpl \
            > "$GITHUB_WORKSPACE/wine-native-make.log" 2>&1 || { tail -40 "$GITHUB_WORKSPACE/wine-native-make.log"; exit 1; }
          make -k -j"$N" include >> "$GITHUB_WORKSPACE/wine-native-make.log" 2>&1 || true
          test -x tools/widl/widl

      - name: Save native Wine tools
        if: steps.winenative.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wine/build-native
          key: wine-native-v1-${{ steps.rev.outputs.wine }}

      # wine/build-macos is the configured iOS tree whose config.h and generated
      # headers the unix-side build scripts include. The repository does not
      # record how it was configured; this is madeira-bcd's configuration.
      - name: Configure Wine iOS tree
        shell: bash
        run: |
          mkdir -p wine/build-macos && cd wine/build-macos
          ../configure --enable-win64 --disable-tests \
            CC="xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0" \
            CROSSCC="xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0" \
            --host=aarch64-apple-darwin --build=x86_64-apple-darwin \
            --with-wine-tools="$GITHUB_WORKSPACE/wine/build-native" \
            --without-freetype --without-fontconfig \
            --without-x --without-opengl --without-vulkan \
            --without-gnutls --without-pcsclite --without-usb \
            --without-v4l2 --without-gphoto --without-inotify \
            --without-sane --without-pulse --without-alsa --without-oss \
            --without-capi --without-cups --without-krb5 --without-ldap \
            --without-netapi --without-sdl --without-udev --without-unwind \
            > "$GITHUB_WORKSPACE/wine-configure.log" 2>&1 || true
          test -f include/config.h || { tail -40 "$GITHUB_WORKSPACE/wine-configure.log"; exit 1; }
          # The headers widl generates from include/*.idl (dwrite.h, wtypes.h...).
          # This Wine has no `include` target, so name each one.
          HDRS=$(cd ../include && ls *.idl | sed 's/\.idl$/.h/; s/^/include\//')
          make -k -j"$(sysctl -n hw.ncpu)" $HDRS > "$GITHUB_WORKSPACE/wine-include.log" 2>&1 || true
          for h in dwrite.h wtypes.h objidl.h; do
            test -f "include/$h" || { echo "::error::include/$h was not generated"; grep -m5 -B2 -A3 "rror" "$GITHUB_WORKSPACE/wine-include.log"; exit 1; }
          done
          # iOS SDK fixups. GnuTLS is linked statically (toolchains/gnutls-ios)
          # and reached through ios_gnutls_shim.h, so the soname is only a
          # string; without these defines bcrypt's and secur32's unix sides
          # compile to empty objects and the app link fails.
          cat >> include/config.h <<'EOF'

          /* iOS SDK fixups appended by CI */
          #undef HAVE_GETATTRLIST
          #ifndef D_TAPE
          #define D_TAPE 1
          #endif
          #ifndef D_DISK
          #define D_DISK 2
          #endif
          #ifndef D_TTY
          #define D_TTY 3
          #endif
          #ifndef SONAME_LIBGNUTLS
          #define SONAME_LIBGNUTLS "libgnutls.so.30"
          #endif
          #ifndef HAVE_GNUTLS_CIPHER_INIT
          #define HAVE_GNUTLS_CIPHER_INIT 1
          #endif
          EOF

      # ---------------------------------------------------- third-party libraries
      - name: Restore GnuTLS / FFmpeg
        id: libs
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/gnutls-ios
            toolchains/ffmpeg-ios
            app/Madeira/libavformat.a
            app/Madeira/libavcodec.a
            app/Madeira/libswresample.a
            app/Madeira/libavutil.a
          key: ios-libs-v1-${{ steps.rev.outputs.gnutls }}-${{ steps.rev.outputs.ffmpeg }}

      - name: Build GnuTLS and FFmpeg
        if: steps.libs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash build/gnutls-ios/build.sh > gnutls.log 2>&1 || { tail -40 gnutls.log; exit 1; }
          bash build/ffmpeg/build.sh > ffmpeg.log 2>&1 || { tail -40 ffmpeg.log; tail -40 build/ffmpeg/obj/*.log 2>/dev/null; exit 1; }

      - name: Save GnuTLS / FFmpeg
        if: steps.libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/gnutls-ios
            toolchains/ffmpeg-ios
            app/Madeira/libavformat.a
            app/Madeira/libavcodec.a
            app/Madeira/libswresample.a
            app/Madeira/libavutil.a
          key: ios-libs-v1-${{ steps.rev.outputs.gnutls }}-${{ steps.rev.outputs.ffmpeg }}

      - name: Build FreeType
        shell: bash
        run: |
          git clone --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype.git research/freetype
          bash build/freetype-ios/build.sh > freetype.log 2>&1 || { tail -40 freetype.log; exit 1; }

      # ------------------------------------------------------- Wine unix side
      - name: Build ntdll-unix
        shell: bash
        run: bash build/ntdll-unix/build.sh 2>&1 | tee ntdll.log; exit ${PIPESTATUS[0]}

      # build/wineserver/build.sh updates an existing libwineserver.a; build
      # the base archive from wine/server first.
      - name: Build base libwineserver.a
        shell: bash
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          BD="$GITHUB_WORKSPACE/build/wineserver"
          OBJ="$BD/obj/base"
          mkdir -p "$OBJ"
          FLAGS=(-arch arm64 -isysroot "$SDK" -miphoneos-version-min=17.0 -O2
            -I"$GITHUB_WORKSPACE/wine/include" -I"$GITHUB_WORKSPACE/wine/include/wine"
            -I"$GITHUB_WORKSPACE/wine/build-macos/include"
            -I"$BD" -I"$GITHUB_WORKSPACE/wine/server"
            -I"$GITHUB_WORKSPACE/build/ntdll-unix/shims"
            -include "$BD/config_ios.h" -include stdarg.h
            -include "$BD/unicode_fix.h" -include "$BD/wineserver_ios_kill.h"
            -DBINDIR=\"/usr/local/bin\" -DDATADIR=\"/usr/local/share\"
            -D__WINESRC__ -DWINE_IOS=1 -Dmain=wineserver_main
            -Wno-implicit-function-declaration)
          BAD=""
          for src in "$GITHUB_WORKSPACE"/wine/server/*.c; do
            n=$(basename "$src" .c)
            xcrun -sdk iphoneos clang "${FLAGS[@]}" -c "$src" -o "$OBJ/$n.o" 2>"$OBJ/$n.err" || BAD="$BAD $n"
          done
          echo "::notice::base wineserver objects that did not compile:${BAD:- none}"
          ar rcs "$BD/obj/libwineserver.a" "$OBJ"/*.o

      - name: Build wineserver
        shell: bash
        run: bash build/wineserver/build.sh 2>&1 | tee wineserver.log; exit ${PIPESTATUS[0]}

      - name: Build win32u-unix
        shell: bash
        run: bash build/win32u-unix/build.sh 2>&1 | tee win32u.log; exit ${PIPESTATUS[0]}

      # ------------------------------------------------------------------- FEX
      - name: Restore FEX iOS build
        id: fex
        uses: actions/cache/restore@v4
        with:
          path: FEX/build-ios
          key: fex-ios-v1-${{ steps.rev.outputs.fex }}

      # build/fex-ios/build.sh's options, plus what a hosted runner needs:
      # cross mode does not infer CMAKE_SYSTEM_PROCESSOR, no ccache, and
      # TUNE_CPU=native would read /proc/cpuinfo, which macOS does not have.
      - name: Build FEX for iOS
        if: steps.fex.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake -S FEX -B FEX/build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF -DBUILD_FEX_LINUX_TESTS=OFF \
            -DENABLE_FEX_ALLOCATOR=OFF -DENABLE_ASSERTIONS=OFF -DENABLE_CLANG_THUNKS=ON \
            -DENABLE_CCACHE=OFF -DENABLE_LTO=OFF -DTUNE_CPU=generic -DTUNE_ARCH=generic \
            > fex-cfg.log 2>&1 || { tail -60 fex-cfg.log; exit 1; }
          cmake --build FEX/build-ios -j"$(sysctl -n hw.ncpu)" \
            --target FEXCore FEXCore_Base JemallocLibs cephes_128bit softfloat_3e fmt xxhash \
            > fex-build.log 2>&1 || { grep -E "error:|Error" fex-build.log | head -40; exit 1; }

      - name: Save FEX iOS build
        if: steps.fex.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: FEX/build-ios
          key: fex-ios-v1-${{ steps.rev.outputs.fex }}

      # ------------------------------------------------------- LLVM 15 for iOS
      # DXMT's shader compiler links LLVM 15 (build/dxmt-ios/README.md). Only
      # the archives and headers are kept, so the cache stays small.
      - name: Restore LLVM for iOS
        id: llvm
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/llvm-ios-build/lib
            toolchains/llvm-ios-build/include
            toolchains/llvm-project/llvm/include
          key: llvm-ios-v1-${{ env.LLVM_TAG }}

      - name: Build LLVM for iOS
        if: steps.llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch "$LLVM_TAG" https://github.com/llvm/llvm-project.git toolchains/llvm-project
          # Apple's ld rejects --gc-sections; treat iOS like Darwin.
          sed -i '' 's/MATCHES "Darwin"/MATCHES "Darwin|iOS"/' toolchains/llvm-project/llvm/cmake/modules/AddLLVM.cmake
          N=$(sysctl -n hw.ncpu)
          cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-host-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DLLVM_TARGETS_TO_BUILD="" -DLLVM_INCLUDE_TESTS=Off \
            -DLLVM_INCLUDE_EXAMPLES=Off -DLLVM_INCLUDE_BENCHMARKS=Off > llvm-host.log 2>&1
          cmake --build toolchains/llvm-host-build --target llvm-tblgen -j"$N" >> llvm-host.log 2>&1
          cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-ios-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DLLVM_TABLEGEN="$GITHUB_WORKSPACE/toolchains/llvm-host-build/bin/llvm-tblgen" \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DLLVM_BUILD_UTILS=Off -DLLVM_BUILD_TOOLS=Off -DLLVM_INCLUDE_TOOLS=Off -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_INCLUDE_TESTS=Off -DLLVM_INCLUDE_EXAMPLES=Off \
            -DLLVM_INCLUDE_BENCHMARKS=Off -DLLVM_INCLUDE_UTILS=Off \
            -DLLVM_ENABLE_TERMINFO=Off -DLLVM_ENABLE_LIBXML2=Off \
            -DLLVM_ENABLE_ZSTD=Off -DLLVM_ENABLE_ZLIB=Off > llvm-ios.log 2>&1
          cmake --build toolchains/llvm-ios-build -j"$N" >> llvm-ios.log 2>&1 || { tail -40 llvm-ios.log; exit 1; }
          ls toolchains/llvm-ios-build/lib/libLLVMCore.a
          # Keep only what dxmt-ios reads.
          rm -rf toolchains/llvm-host-build
          find toolchains/llvm-ios-build -mindepth 1 -maxdepth 1 ! -name lib ! -name include -exec rm -rf {} +
          find toolchains/llvm-project -mindepth 1 -maxdepth 1 ! -name llvm -exec rm -rf {} +
          find toolchains/llvm-project/llvm -mindepth 1 -maxdepth 1 ! -name include -exec rm -rf {} +

      - name: Save LLVM for iOS
        if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/llvm-ios-build/lib
            toolchains/llvm-ios-build/include
            toolchains/llvm-project/llvm/include
          key: llvm-ios-v1-${{ env.LLVM_TAG }}

      # ------------------------------------------------------------------ DXMT
      # Compiled by the shaders job with Xcode 26's Metal compiler.
      - name: Fetch shader headers
        uses: actions/download-artifact@v4
        with:
          name: shader-headers
          path: build/dxmt-ios/shader-headers

      - name: Build DXMT unix side
        shell: bash
        run: |
          set +e
          bash build/dxmt-ios/build.sh 2>&1 | tee dxmt.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            for f in build/dxmt-ios/obj/*.err; do
              grep -q "error:" "$f" 2>/dev/null && { echo "===== $f"; grep -m 10 -B2 -A6 "error:" "$f"; }
            done
          fi
          exit "$rc"

      # The script refreshes libdxmt_combined.a only when one exists; make it.
      - name: Combine DXMT and LLVM
        shell: bash
        run: |
          xcrun -sdk iphoneos libtool -static -o app/Madeira/libdxmt_combined.a \
            build/dxmt-ios/obj/*.o toolchains/llvm-ios-build/lib/*.a
          ls -la app/Madeira/libdxmt_combined.a

      # ------------------------------------------------------ the other pieces
      - name: Build on-device pairing (Rust)
        shell: bash
        run: bash build/rppairing-ios/build.sh

      - name: Build Madeira Dock
        shell: bash
        run: bash build/madeira-dock/build.sh

      # The 32-bit farm WoW64 sessions load (docs/WOW64.md). Not committed
      # upstream, but the releases carry it; without it 32-bit games cannot
      # start. Only the installed farm is cached.
      - name: Restore 32-bit (i386) farm
        id: i386
        uses: actions/cache/restore@v4
        with:
          path: app/Madeira/i386-windows
          key: i386-farm-v1-${{ steps.rev.outputs.wine }}-${{ steps.rev.outputs.dxmt }}-${{ hashFiles('build/wine-i386/build.sh') }}

      - name: Build 32-bit (i386) farm
        if: steps.i386.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash build/wine-i386/build.sh > wine-i386.log 2>&1 || { grep -E "error|Error" wine-i386.log | head -40; tail -30 wine-i386.log; exit 1; }
          tail -5 wine-i386.log
          echo "::notice::i386 farm: $(ls app/Madeira/i386-windows | wc -l | tr -d ' ') files"

      - name: Save 32-bit (i386) farm
        if: steps.i386.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/Madeira/i386-windows
          key: i386-farm-v1-${{ steps.rev.outputs.wine }}-${{ steps.rev.outputs.dxmt }}-${{ hashFiles('build/wine-i386/build.sh') }}

      # tools/fetch-vcruntime.md: Microsoft's DLLs, unmodified. 7-Zip only sees
      # the Burn bundle's stub, so cabextract/msiextract peel the containers and
      # each DLL is taken by its PE machine type (AMD64), not by its name.
      - name: Fetch VC++ runtime from Microsoft
        if: inputs.include_vcruntime
        shell: bash
        run: |
          DEST=app/Madeira/x86_64-vcruntime
          mkdir -p "$DEST"
          curl -fL --retry 3 -o /tmp/vcr.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          rm -rf /tmp/vcx; mkdir -p /tmp/vcx
          cabextract -q -d /tmp/vcx /tmp/vcr.exe || true
          for pass in 1 2 3 4; do
            find /tmp/vcx -type f -size +20k | while IFS= read -r f; do
              case "${f##*/}" in *.dll|*.DLL|*.exe|*.EXE|*_amd64|*_arm64|*_x86) continue ;; esac
              [ -d "$f.d" ] && continue
              mkdir -p "$f.d"
              cabextract -q -d "$f.d" "$f" > /dev/null 2>&1 || msiextract -C "$f.d" "$f" > /dev/null 2>&1 || rmdir "$f.d"
            done
          done
          python3 - "$DEST" <<'EOF'
          import os, shutil, struct, sys
          dest = sys.argv[1]
          want = """concrt140 msvcp140 msvcp140_1 msvcp140_2 msvcp140_atomic_wait
                    msvcp140_codecvt_ids vcamp140 vccorlib140 vcomp140 vcruntime140
                    vcruntime140_1 vcruntime140_threads mfc140 mfc140u""".split()
          def is_x64(p):
              d = open(p, 'rb').read(4096)
              if len(d) < 0x40: return False
              pe = struct.unpack_from('<I', d, 0x3c)[0]
              return d[pe:pe+4] == b'PE\0\0' and struct.unpack_from('<H', d, pe+4)[0] == 0x8664
          files = [os.path.join(r, f) for r, _, fs in os.walk('/tmp/vcx') for f in fs]
          missing = []
          for w in want:
              hit = next((p for p in files if os.path.basename(p).lower().startswith(w + '.dll') and is_x64(p)), None)
              if hit: shutil.copyfile(hit, os.path.join(dest, w + '.dll'))
              else: missing.append(w)
          print('::notice::vcruntime: %d of %d DLLs%s' % (len(want) - len(missing), len(want), (', missing ' + ' '.join(missing)) if missing else ''))
          EOF

      - name: Check linked archives
        shell: bash
        run: |
          MISSING=""
          for a in libgmp.a libgnutls.a libhogweed.a libnettle.a libntdll_unix.a \
                   libwin32u_unix.a libwineserver.a libdxmt_combined.a libmadeira_rppairing.a \
                   libavformat.a libavcodec.a libswresample.a libavutil.a; do
            [ -f "app/Madeira/$a" ] || MISSING="$MISSING app/Madeira/$a"
          done
          for a in FEXCore/Source/libFEXCore.a FEXCore/Source/libFEXCore_Base.a \
                   FEXCore/Source/libJemallocLibs.a External/cephes/libcephes_128bit.a \
                   External/fmt/libfmt.a External/SoftFloat-3e/libsoftfloat_3e.a \
                   External/xxhash/cmake_unofficial/libxxhash.a; do
            [ -f "FEX/build-ios/$a" ] || MISSING="$MISSING FEX/build-ios/$a"
          done
          [ -z "$MISSING" ] || { echo "::error::missing:$MISSING"; exit 1; }

      # -------------------------------------------------------------------- app
      # The project bundles x86_64-vcruntime as a folder, so it has to exist
      # even when the DLLs are left out.
      - name: Stage licence copies
        shell: bash
        run: |
          mkdir -p app/Madeira/x86_64-vcruntime
          bash build/stage-licenses.sh

      - name: Stamp build number
        shell: bash
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" app/Madeira/Info.plist || true

      - name: Build app (Debug, unsigned)
        shell: bash
        run: |
          set +e
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira \
            -sdk iphoneos -configuration Debug CODE_SIGNING_ALLOWED=NO \
            archive -archivePath build-out/Madeira.xcarchive > archive.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            grep -E "^[^ ].*: (error|fatal error):" archive.log | head -30
            grep -E "Undefined symbol|^ld: |symbol\(s\) not found|referenced from|duplicate symbol" archive.log | head -40
            sed -n '/The following build commands failed/,/failures)/p' archive.log | cut -c1-200 | head -15
          fi
          exit "$rc"

      # DXMT finds these with dlsym in the main binary; without them every
      # D3D11 game renders black and says nothing.
      - name: Check exported macdrv symbols
        shell: bash
        run: |
          BIN=build-out/Madeira.xcarchive/Products/Applications/Madeira.app/Madeira
          xcrun dyld_info -exports "$BIN" > exports.txt
          for sym in macdrv_functions get_win_data release_win_data \
                     macdrv_view_create_metal_view macdrv_view_get_metal_layer \
                     macdrv_view_release_metal_view; do
            grep -qE "_$sym\$" exports.txt || { echo "::error::$sym is not exported"; exit 1; }
          done

      - name: Package IPA
        id: ipa
        shell: bash
        run: |
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build-out/Madeira.xcarchive/Products/Applications/Madeira.app/Info.plist)
          NAME="Madeira-$VER-${{ github.run_number }}-$(git rev-parse --short HEAD)-debug-unsigned"
          mkdir -p build-out/Payload
          cp -R build-out/Madeira.xcarchive/Products/Applications/Madeira.app build-out/Payload/
          (cd build-out && ditto -c -k --keepParent Payload "$NAME.ipa")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa.outputs.name }}
          path: build-out/${{ steps.ipa.outputs.name }}.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            *.log
            build/*/obj/*.err
          if-no-files-found: ignore
          retention-days: 7
