# Runs Madeira's host checks (tests/host/*.py) on a branch, the way their
# headers ask: swiftc on Linux, cc, python3 with cryptography, and the
# libssl/liblzma/zlib development files. No Steam, no device.
name: Host checks

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to check
        type: string
        required: true
      checks:
        description: Space-separated tests/host scripts (file names)
        type: string
        default: check-steam-library.py check-steam-cloud.py

jobs:
  checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: false

      - name: Tools
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libssl-dev liblzma-dev zlib1g-dev python3-cryptography
          if ! command -v swiftc > /dev/null; then
            curl -fsSL https://download.swift.org/swift-6.1.2-release/ubuntu2404/swift-6.1.2-RELEASE/swift-6.1.2-RELEASE-ubuntu24.04.tar.gz -o /tmp/swift.tgz
            sudo mkdir -p /opt/swift && sudo tar -xzf /tmp/swift.tgz -C /opt/swift --strip-components=1
            echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"
          fi

      - name: Run
        shell: bash
        run: |
          swiftc --version
          status=0
          for check in ${{ inputs.checks }}; do
            echo "::group::$check"
            python3 "tests/host/$check" || status=1
            echo "::endgroup::"
            [ "$status" -eq 0 ] || echo "::error::$check failed"
          done
          exit "$status"
