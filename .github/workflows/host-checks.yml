# Runs Madeira's host checks (tests/host/*.py) on a branch, the way their
# headers ask: swiftc, cc, python3 with cryptography, and the
# libssl/liblzma/zlib development files. No Steam, no device.
name: Host checks

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to check
        type: string
        required: true
      checks:
        description: Space-separated tests/host scripts (file names)
        type: string
        default: check-steam-library.py
      runner:
        description: ubuntu-24.04 for the Linux checks; macos-15 for those that need Apple frameworks (CryptoKit)
        type: string
        default: ubuntu-24.04

jobs:
  checks:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: false

      # compression.zstd (check-steam-library.py's test vectors) is Python 3.14's.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Tools
        shell: bash
        run: |
          python3 -m pip install -q cryptography
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q libssl-dev liblzma-dev zlib1g-dev
          fi
          if ! command -v swiftc > /dev/null; then
            curl -fsSL https://download.swift.org/swift-6.1.2-release/ubuntu2404/swift-6.1.2-RELEASE/swift-6.1.2-RELEASE-ubuntu24.04.tar.gz -o /tmp/swift.tgz
            sudo mkdir -p /opt/swift && sudo tar -xzf /tmp/swift.tgz -C /opt/swift --strip-components=1
            echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"
          fi

      - name: Run
        shell: bash
        run: |
          swiftc --version
          python3 --version
          status=0
          for check in ${{ inputs.checks }}; do
            echo "::group::$check"
            python3 "tests/host/$check" || { status=1; echo "::error::$check failed"; }
            echo "::endgroup::"
          done
          exit "$status"
